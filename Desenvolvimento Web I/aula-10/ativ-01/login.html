<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="wrap">
    <main class="card" aria-labelledby="login-title">
      <div class="brand" role="img" aria-hidden="true">
        <div class="logo">L</div>
        <div>
          <h1 id="login-title">Entrar</h1>
          <p class="sub">Acesse sua conta</p>
        </div>
      </div>

      <form method="post" action="login.php" id="loginForm">
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Username" required autocomplete="email" />
        </div>

        <div>
          <label for="password">Senha</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" required autocomplete="current-password" minlength="6" />
          </div>
        </div>

        <div class="row" aria-hidden="false">
          <label class="checkbox">
            <input type="checkbox" id="remember" name="remember" />
            <span>Continuar conectado</span>
          </label>
        </div>

        <button type="submit">Entrar</button>

        <p class="small">Não tem conta? <a class="link">Criar conta</a></p>
      </form>
    </main>
  </div>
</body>
</html>
